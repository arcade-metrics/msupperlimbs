name: msupperlimbs
description: Upper limbs assessments (SQL + MediaPipe rewrite)
publish_to: "none"
version: 3.0.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  camera: ^0.12.0
  permission_handler: ^11.3.1
  sensors_plus: ^6.1.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo-light-1024x1024.png
    - assets/logo-dark-1024x1024.png
    - assets/app_icon.png
